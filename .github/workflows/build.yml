name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore release key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APK signed with a temporary debug key (updates will not install over it)."
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --target-platform android-arm,android-arm64 \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
          ver=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "eterotv-$ver.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: eterotv-android
          path: |
            eterotv-*.apk
            tool/instalar-eterotv-firetv.bat

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Windows app
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          flutter build windows --release --build-number=${{ github.run_number }} \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
      - name: Zip
        shell: pwsh
        run: |
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace 'version:\s*', '') -replace '\+.*', ''
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "eterotv-windows-$ver.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: eterotv-windows
          path: eterotv-windows-*.zip

  release:
    # Every push to main, or a manual run on main, publishes a release.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from CHANGELOG.md
        run: |
          ver=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          awk -v v="$ver" '
            /^## / { if (on) exit; if ($2 == v) { on = 1; next } }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Versión $ver. Ver CHANGELOG.md." > release-notes.md
          fi
          { echo "**Versión $ver**"; echo; cat release-notes.md; } > notes.md
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EteroTV build ${{ github.run_number }}
          body_path: notes.md
          files: |
            eterotv-*.apk
            eterotv-windows-*.zip
            tool/instalar-eterotv-firetv.bat
